name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test-cli:
    name: CLI Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build CLI
        working-directory: cli
        run: cargo build --verbose

      - name: Run unit tests
        working-directory: cli
        run: cargo test --verbose

      - name: Run selftest
        run: cli/target/debug/shadow-cli selftest

      - name: Run contract tests
        run: python3 tests/test_cli.py cli/target/debug/shadow-cli

  test-component:
    name: Component Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check component structure
        run: python3 scripts/test_4d.py
