name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 0.1.0)"
        required: true
        type: string

jobs:
  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build ARM64
        working-directory: cli
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        working-directory: cli
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p target/universal
          lipo -create -output target/universal/shadow-cli \
            cli/target/aarch64-apple-darwin/release/shadow-cli \
            cli/target/x86_64-apple-darwin/release/shadow-cli
          lipo -archs target/universal/shadow-cli

      - name: Generate SHA256
        run: |
          shasum -a 256 target/universal/shadow-cli > target/universal/shadow-cli.sha256
          cat target/universal/shadow-cli.sha256

      - name: Zip universal binary
        run: |
          cd target/universal
          zip shadow-cli-macos-universal.zip shadow-cli shadow-cli.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-cli-macos-universal
          path: target/universal/shadow-cli-macos-universal.zip

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build x64
        working-directory: cli
        run: cargo build --release

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash cli/target/release/shadow-cli.exe -Algorithm SHA256).Hash
          $hash.ToLower() | Out-File -Encoding ascii cli/target/release/shadow-cli.exe.sha256
          Get-Content cli/target/release/shadow-cli.exe.sha256

      - name: Zip Windows binary
        shell: pwsh
        run: |
          Compress-Archive -Path cli/target/release/shadow-cli.exe,cli/target/release/shadow-cli.exe.sha256 -DestinationPath shadow-cli-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-cli-windows-x64
          path: shadow-cli-windows-x64.zip

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: shadow-cli-macos-universal
          path: artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: shadow-cli-windows-x64
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: shadow-cli ${{ github.event.inputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/macos/shadow-cli-macos-universal.zip
            artifacts/windows/shadow-cli-windows-x64.zip
