name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bump to (e.g. 0.1.0)"
        required: true
        type: string

jobs:
  bump:
    name: Bump version to ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update version in Cargo.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ github.event.inputs.version }}"/' cli/Cargo.toml

      - name: Update version in template.json
        run: |
          python3 -c "
          import json
          with open('template.json') as f:
              d = json.load(f)
          d['version'] = '${{ github.event.inputs.version }}'
          with open('template.json', 'w') as f:
              json.dump(d, f, indent=2)
          "

      - name: Update version in package.json
        run: |
          python3 -c "
          import json
          with open('package.json') as f:
              d = json.load(f)
          d['version'] = '${{ github.event.inputs.version }}'
          with open('package.json', 'w') as f:
              json.dump(d, f, indent=2)
          "

      - name: Update version in protocol.rs
        run: |
          sed -i 's/pub const CLI_VERSION: &str = ".*"/pub const CLI_VERSION: \&str = "${{ github.event.inputs.version }}"/' cli/src/protocol.rs

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bump version to ${{ github.event.inputs.version }}"
          git push
