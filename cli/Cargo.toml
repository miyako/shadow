[package]
name = "shadow-cli"
version = "0.1.0"
edition = "2021"
description = "Image shadow generator CLI"
license = "MIT"

[[bin]]
name = "shadow-cli"
path = "src/main.rs"

[dependencies]
image = "0.25"
fastblur = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
